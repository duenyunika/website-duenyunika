<div class="reveal card pad" style="margin-top:24px;">
  <h3 style="font-size:17px; margin-bottom:14px; color:var(--green-deep);">📝 Buku Tamu</h3>

  <form id="formTamu" style="display:grid; gap:10px; margin-bottom:20px; max-width:420px;">
    <input type="text" id="inputNama" placeholder="Nama Anda" required
      style="padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px;">
    <textarea id="inputPesan" placeholder="Tulis pesan atau kesan Anda" required rows="3"
      style="padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; resize:vertical;"></textarea>
    <button type="submit" class="btn"
      style="justify-self:start; background:var(--green-deep); color:#fff; border:none; padding:10px 22px; border-radius:8px; font-size:14px; cursor:pointer;">
      Kirim Pesan
    </button>
    <span id="statusKirim" style="font-size:13px; color:var(--muted);"></span>
  </form>

  <div id="daftarTamu" style="display:grid; gap:12px;">
    <p style="color:var(--muted); font-size:13.5px;">Memuat pesan...</p>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymL6I6mK7WWk9nxc1uN9f3k_5hx8plebhbkZqCCwfNp-OFpqomRaqa36rx9VjuBzRnkQ/exec";

  async function muatBukuTamu() {
    const wadah = document.getElementById('daftarTamu');
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();

      if (data.status === "error") {
        wadah.innerHTML = '<p style="color:var(--muted); font-size:13.5px;">Gagal memuat: ' + data.message + '</p>';
        return;
      }
      if (data.length === 0) {
        wadah.innerHTML = '<p style="color:var(--muted); font-size:13.5px;">Belum ada pesan. Jadilah yang pertama menulis!</p>';
        return;
      }

      wadah.innerHTML = data.reverse().map(item => `
        <div style="border-bottom:1px solid var(--line); padding-bottom:10px;">
          <div style="font-weight:600; font-size:14px; color:var(--green-deep);">${item.nama}</div>
          <div style="font-size:13.5px; color:var(--muted); margin-top:2px;">${item.pesan}</div>
        </div>
      `).join('');
    } catch (err) {
      wadah.innerHTML = '<p style="color:var(--muted); font-size:13.5px;">Gagal memuat buku tamu.</p>';
    }
  }

  document.getElementById('formTamu').addEventListener('submit', async function (e) {
    e.preventDefault();
    const nama = document.getElementById('inputNama').value.trim();
    const pesan = document.getElementById('inputPesan').value.trim();
    const status = document.getElementById('statusKirim');
    status.textContent = "Mengirim...";

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ nama, pesan })
      });
      const hasil = await res.json();

      if (hasil.status === "success") {
        status.textContent = "Terkirim, terima kasih!";
        this.reset();
        muatBukuTamu();
      } else {
        status.textContent = "Gagal: " + hasil.message;
      }
    } catch (err) {
      status.textContent = "Gagal mengirim, coba lagi.";
    }
  });

  muatBukuTamu();
</script>
